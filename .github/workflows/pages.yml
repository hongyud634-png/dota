name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check data update and filtering
        run: |
          node scripts/check-data.mjs
          node scripts/check-heroes.mjs
          node scripts/check-auto-sync.mjs
          node scripts/check-ranking.mjs

      - name: Update complete league data
        run: node scripts/update-data.mjs --backfill-all

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opendota_league_18113_seed.json seed/opendota_league_18113_seed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update league data"
            git push
          fi

      - name: Publish to existing Pages source branch
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/dota-pages" origin/gh-pages
          cp -a public/. "$RUNNER_TEMP/dota-pages/"
          git -C "$RUNNER_TEMP/dota-pages" add .
          if ! git -C "$RUNNER_TEMP/dota-pages" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/dota-pages" commit -m "Publish updated league dashboard"
            git -C "$RUNNER_TEMP/dota-pages" push origin HEAD:gh-pages
          fi

      # GITHUB_TOKEN pushes do not automatically start a Pages build.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
